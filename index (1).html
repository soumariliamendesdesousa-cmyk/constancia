*{box-sizing:border-box}
html,body{height:100%}
body{
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  background:var(--page);color:var(--ink);
  font:400 15px/1.45 var(--font-body);
  -webkit-text-size-adjust:100%;transition:background-color .35s;
}
body[data-tab="kanban"]{--page:var(--bg-kanban)}
body[data-tab="calendario"]{--page:var(--bg-calendario)}
body[data-tab="projetos"]{--page:var(--bg-projetos)}
body[data-tab="desempenho"]{--page:var(--bg-desempenho)}
body[data-tab="configuracoes"]{--page:var(--bg-configuracoes)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* topo */
.top{position:relative;display:flex;align-items:center;justify-content:center;padding:22px var(--gr) 4px var(--gl);min-height:64px}
.logo{font-family:var(--font-logo);font-size:46px;line-height:1;color:var(--logo);display:flex;align-items:center;gap:6px}
.logo svg{width:24px;height:24px;stroke:var(--rose);stroke-width:1.6;margin-top:8px}
.gear{position:absolute;right:var(--gr);top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}

/* chips de área */
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:10px var(--gr) 6px var(--gl);scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.chip.add{background:var(--chip-add)}

/* miolo */
main{flex:1;min-height:0;overflow-y:auto;padding:12px var(--gr) 96px var(--gl)}
main.home{overflow:hidden;padding-bottom:10px;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.ph>div{min-width:0;flex:1 1 200px}
h1.title{font:500 34px/1.1 var(--font-head);text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
h2.sec{font:500 28px/1.15 var(--font-head);text-wrap:balance}

.btn{min-height:44px;padding:0 20px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.rosa{background:var(--col-inbox);color:var(--ink)}
.btn.small{min-height:38px;padding:0 16px;font-size:14px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px}
.linkbtn.armed,.btn.armed{color:var(--danger);font-weight:500}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}

/* saudação */
.hello{position:relative;overflow:hidden;border-radius:28px;min-height:168px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;background-color:var(--hb);background-image:var(--himg);background-size:cover;background-position:right center;background-repeat:no-repeat;border:1px solid var(--line);flex:none;color:var(--hink)}
.hello::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--hb) 0%,var(--hb) 36%,transparent 80%);opacity:.78;pointer-events:none}
.hello>*{position:relative;max-width:60%}
.hello[data-period="manha"]{--himg:var(--img-manha);--hb:#FCC9D4;--hink:var(--ink-day)}
.hello[data-period="tarde"]{--himg:var(--img-tarde);--hb:#FDDCB8;--hink:var(--ink-day)}
.hello[data-period="noite"]{--himg:var(--img-noite);--hb:#08396C;--hink:var(--ink-night)}
.hello h1{font:600 31px/1.05 var(--font-head);text-wrap:balance}
.hello p{margin-top:6px;font-size:13.5px;line-height:1.4}
.hello .heart{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:4px;fill:none;stroke:#E4607F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main[data-anim]{animation:slide-in .28s ease-out both}
main[data-anim="l"]{--sx:28px}
main[data-anim="r"]{--sx:-28px}
@keyframes slide-in{from{opacity:0;transform:translateX(var(--sx))}to{opacity:1;transform:none}}

.home-sec{margin:16px 0 10px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:none}
.tile{border-radius:18px;padding:10px 10px 12px;display:flex;flex-direction:column;border:1px solid var(--line)}
.tile .tl{font-size:11.5px;color:var(--muted)}
.tile .tv{font:300 clamp(20px,6vw,28px)/1.1 var(--font-body);margin-top:8px;font-variant-numeric:tabular-nums}
.tile .tl{white-space:nowrap;font-size:10.5px}
.tile{padding:10px 8px 12px}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:2px;flex:1;overflow-wrap:anywhere}
.tile .tb{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.tile .tb i{display:block;height:100%;border-radius:inherit}
.tile.done{background:var(--t-done)} .tile.done i{background:var(--bar-done)}
.tile.pend{background:var(--t-pend)} .tile.pend i{background:var(--bar-pend)}
.tile.proc{background:var(--t-proc)} .tile.proc i{background:var(--bar-proc)}
.tile.late{background:var(--t-late)} .tile.late i{background:var(--bar-late)}

.prior{margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
.prior h2{font:500 26px/1.15 var(--font-head)}
.prior .list{flex:1;min-height:0;overflow-y:auto;margin-top:6px;padding-bottom:76px}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 0}

.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* tarefas */
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child,.grp+.trow{border-top:0}
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.chk::after{content:"";position:absolute;inset:-9px}
.chk svg{width:14px;height:14px;stroke:var(--on-btn);stroke-width:2;opacity:0}
.chk[data-p="3"]{border-color:var(--p3)}
.chk[data-p="2"]{border-color:var(--p2)}
.chk[data-p="1"]{border-color:var(--p1)}
.tag .ico{width:14px;height:14px}
.star{width:14px;height:14px;fill:var(--p2);stroke:var(--p2);stroke-width:1.4;stroke-linejoin:round}
.ttitle .star{margin-left:6px;vertical-align:-1px}
.opt .star{width:16px;height:16px;fill:none;stroke:currentColor}
.opt[aria-pressed="true"] .star{fill:var(--p2);stroke:var(--p2)}
.tnote{display:block;font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.chk[aria-pressed="true"]{background:var(--btn);border-color:var(--btn)}
.chk[aria-pressed="true"] svg{opacity:1}
.tmain{flex:1;min-width:0;text-align:left;display:block}
.ttitle{display:block;font-weight:500;overflow-wrap:anywhere}
.ttitle.is-done{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag.late{color:var(--danger);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 8px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 min(78vw,300px);scroll-snap-align:start;border-radius:24px;padding:14px;min-height:360px;border:1px solid var(--line)}
.col.inbox{background:var(--col-inbox)} .col.hoje{background:var(--col-hoje)} .col.and{background:var(--col-and)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.col-h h2{font-size:15px;font-weight:500;flex:1}
.count{min-width:26px;height:24px;padding:0 8px;border-radius:99px;background:var(--card);display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.kcard{background:var(--card);border-radius:18px;padding:10px 12px 8px;margin-top:8px;border:1px solid var(--line)}
.kcard .trow{border:0;padding:0}
.kmove{display:flex;justify-content:flex-end;gap:4px;margin-top:2px}
.kmove button{width:44px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.kmove button:hover{background:var(--soft)}
.kmove svg{width:20px;height:20px}
.colempty{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 6px}
@media (min-width:760px){.col{flex:1 1 0}.board{scroll-snap-type:none}}

/* calendário */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calbar .lab{flex:1;text-align:center;font:500 24px/1.1 var(--font-head);min-width:0}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.rbtn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1.05;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:4px;font-variant-numeric:tabular-nums}
.day.blank{pointer-events:none}
.day.today{box-shadow:inset 0 0 0 1.5px var(--btn)}
.day[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.dots i.dn{opacity:.35}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.dayhead h2{font:500 26px/1.15 var(--font-head)}
.wk{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .wd{flex:none;width:46px;text-align:center;border-radius:14px;padding:6px 0;font-variant-numeric:tabular-nums}
.wk .wd b{display:block;font:400 22px/1.1 var(--font-head);font-weight:500}
.wk .wd span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wk.today .wd{background:var(--btn);color:var(--on-btn)}
.wk.today .wd span{color:inherit}
.wk .wl{flex:1;min-width:0}
.wk .wl .trow:first-child{padding-top:0}
.wk .wnone{color:var(--muted);font-size:13.5px;padding-top:8px}
.wk .wadd{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* projetos */
.pcard{margin-bottom:12px}
.pcard-h{display:flex;align-items:flex-start;gap:10px}
.pcard-h h3{font:500 25px/1.15 var(--font-head);flex:1;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--line);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar-done);border-radius:inherit}
.pstat{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.plist{margin-top:6px}

/* desempenho */
.perf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.perf-top>div{flex:1 1 200px;min-width:0}
select.inp{width:auto;min-width:0;max-width:100%}
.stack>*+*{margin-top:12px}
.card h2.ct{font:500 25px/1.15 var(--font-head);margin-bottom:10px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:8px}
.barcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bn{font-size:12.5px;color:var(--muted)}
.bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bf{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--bar-done)}
.bf.z{background:var(--line)}
.bl{font-size:12px;color:var(--muted)}
.bl.now{color:var(--ink);font-weight:500}
.hist li{padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hi-t{font-weight:500;overflow-wrap:anywhere}
.hi-m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* dock */
.dock{position:relative;flex:none}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px var(--gr) 8px var(--gl);border-top:1px solid var(--line);background:var(--nav);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;font-size:10.5px;color:var(--muted);min-width:0}
.tab span{max-width:100%;overflow:hidden;white-space:nowrap}
.tab[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:500}
.fab{position:absolute;right:var(--gr);bottom:calc(100% + 14px);width:58px;height:58px;border-radius:20px;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
.fab svg{width:26px;height:26px;stroke-width:1.8}

/* sheets */
.back{position:fixed;inset:0;background:rgba(50,35,45,.4);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:520px;z-index:51;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  max-height:90vh;max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:500 28px/1.1 var(--font-head)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:block}
.inp{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--soft);display:inline-flex;align-items:center;gap:7px}
.opt[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;border-radius:16px;font-variant-numeric:tabular-nums;min-width:0}
.wday .wl1{font-size:11.5px;color:var(--muted)}
.wday .wn{font:500 21px/1.1 var(--font-head)}
.wday.today{box-shadow:inset 0 0 0 1.5px var(--btn)}
.wday[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.wday[aria-pressed="true"] .wl1{color:inherit}
.monthbtn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:2px;font:500 19px/1.1 var(--font-head);min-height:44px;padding:0 2px;border-radius:14px;white-space:nowrap}
.chev{width:18px;height:18px;transition:transform .2s}
.chev.up{transform:rotate(180deg)}
.mgrid{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mgrid .day{aspect-ratio:auto;height:42px;padding-top:5px;gap:2px}
.calcard{padding:14px}
.calbar{margin-bottom:10px}
.datepick{position:relative;overflow:hidden;cursor:pointer}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.actions .btn.main{flex:1 1 140px}
.arealist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.arealist li:first-child{border-top:0}
.arealist .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.arealist .st{font-size:13px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .inp{flex:1;min-width:0}

.toast{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:60;
  background:var(--btn);color:var(--on-btn);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:14.5px}
.toast button{text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:32px}

.hello h1{font:700 42px/1 var(--font-logo);text-wrap:balance}
.tile .tl{font-size:10px;letter-spacing:-.1px}
nav.tabs{grid-template-columns:repeat(6,minmax(0,1fr));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{font-size:9.5px;letter-spacing:-.1px}
.col.afazer{background:var(--col-hoje)}
.col.fazendo{background:var(--col-and)}

.kact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.titlerow{display:flex;gap:8px;align-items:center}
.titlerow .inp{flex:1;min-width:0}
.starbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center}
.starbtn .star{width:24px;height:24px;fill:none;stroke:var(--muted)}
.starbtn[aria-pressed="true"] .star{fill:var(--p2);stroke:var(--p2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.col.aguardando{background:var(--col-wait)} .col.conc{background:var(--col-done)} .col.procr{background:var(--col-procr)}
.pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--soft);text-align:left;min-height:44px}
.pal[aria-pressed="true"]{border:2px solid var(--btn);padding:9px 11px}
.pal .sw3{display:flex;gap:4px}
.pal .sw3 i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.sublbl{font-size:13px;color:var(--muted);margin:12px 0 6px;display:block}
.card .sublbl:first-of-type{margin-top:0}

.tagline{text-align:center;font:400 13.5px/1.4 var(--font-body);color:var(--muted);margin:4px var(--gr) 8px var(--gl);letter-spacing:.02em}
.logo svg.sprout{width:34px;height:34px;margin-top:4px;margin-left:-2px;stroke:none}
.logo svg.wm{height:58px;width:auto;max-width:82vw;margin:0}
.logo svg.wm .w{fill:#7A3F54}
.logo svg.wm .ry3{fill:none;stroke:#F2B5A0;stroke-width:5;stroke-linecap:round}
.logo svg.wm .gp{stroke:var(--page);stroke-width:5;stroke-linejoin:round;paint-order:stroke}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo svg.wm .w{fill:#EBC6D2}}
:root[data-theme="dark"] .logo svg.wm .w{fill:#EBC6D2}
.logo img.wmimg{height:56px;width:auto;max-width:80vw;display:block}
body:not([data-tab="inicio"]) .top{min-height:0;padding-top:14px;padding-bottom:0}
body:not([data-tab="inicio"]) .top .logo{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo img.wmimg{background:#FBF1F4;border-radius:18px;padding:5px 14px;height:62px}}
:root[data-theme="dark"] .logo img.wmimg{background:#FBF1F4;border-radius:18px;padding:5px 14px;height:62px}
.gate{position:fixed;inset:0;z-index:1000;background:#FCEEF2;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate .box{max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate .logo{justify-content:center}
.gate .gtag{font:400 16px/1.4 var(--font-body);color:var(--muted);letter-spacing:.02em;margin:0}
.gate .gmsg{font:400 15px/1.45 var(--font-body);color:var(--ink);margin:6px 0 0;min-height:22px}
.gate .gerr{color:var(--danger)}
.gate .btn{font-size:16px;padding:13px 22px}
.gate .gnote{font:400 13px/1.4 var(--font-body);color:var(--muted);margin:2px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gate{background:#2B2228}}
:root[data-theme="dark"] .gate{background:#2B2228}
</style>
</head>
<body>

<div id="gate" class="gate"><div class="box">
  <div class="logo" aria-label="Constância"><img id="gatelogo" class="wmimg" alt="Constância" src=""></div>
  <p class="gtag">Tudo começa com uma escolha.</p>
  <p id="gmsg" class="gmsg" role="status">Carregando…</p>
  <button type="button" id="gbtn" class="btn" hidden>Entrar com o Google</button>
  <p id="gnote" class="gnote" hidden>Suas tarefas ficam salvas na sua conta. Entre com o mesmo Gmail em qualquer celular para ver tudo.</p>
</div></div>

/* ---------- indicadores ---------- */
function stats(list){
  var total=list.length;
  var done=list.filter(function(x){return x.done}).length;
  var overdue=list.filter(isLate).length;
  var postponed=list.filter(function(x){return !isHeld(x)&&x.adiamentos.length>0}).length;
  var proc=list.filter(function(x){return !isHeld(x)&&(x.adiamentos.length>0||isLate(x))}).length;
  var pct=function(n){return total?Math.round(n/total*100):0};
  return {total:total,done:done,pending:total-done,overdue:overdue,postponed:postponed,donePct:pct(done),pendPct:pct(total-done),procPct:pct(proc),overPct:pct(overdue)};
}
function tiles(st){
  return '<div class="tiles">'+
    '<div class="tile done"><span class="tl">Concluídas</span><span class="tv">'+st.donePct+'%</span><span class="ts">'+st.done+' de '+st.total+' '+pl(st.total,'tarefa','tarefas')+'</span><span class="tb"><i style="width:'+st.donePct+'%"></i></span></div>'+
    '<div class="tile pend"><span class="tl">Pendentes</span><span class="tv">'+st.pendPct+'%</span><span class="ts">'+st.pending+' '+pl(st.pending,'tarefa em aberto','tarefas em aberto')+'</span><span class="tb"><i style="width:'+st.pendPct+'%"></i></span></div>'+
    '<div class="tile proc"><span class="tl">Procrastinação</span><span class="tv">'+st.procPct+'%</span><span class="ts">'+st.postponed+' '+pl(st.postponed,'adiada','adiadas')+' · '+st.overdue+' '+pl(st.overdue,'atrasada','atrasadas')+'</span><span class="tb"><i style="width:'+st.procPct+'%"></i></span></div>'+
    '<div class="tile late"><span class="tl">Atrasadas</span><span class="tv">'+st.overdue+'</span><span class="ts">'+(st.overdue?'Precisam de atenção':'Nada atrasado')+'</span><span class="tb"><i style="width:'+st.overPct+'%"></i></span></div>'+
  '</div>';
}

function weekDays(sel){

}

function periodFrom(){
  var t=today(),p=UI.period;
  if(p==='15')return addDays(t,-14);
  var m={m3:3,m6:6,m9:9,m12:12}[p];
  if(m){var d=parse(t);d.setMonth(d.getMonth()-m);d.setDate(d.getDate()+1);return ymd(d)}
  return addDays(t,-6);
}
function chart7(){
  var days=[];for(var i=6;i>=0;i--)days.push(addDays(today(),-i));
  var v=vis();
  var counts=days.map(function(d){return v.filter(function(t){return t.done&&t.doneAt&&localDay(t.doneAt)===d}).length});
  var max=Math.max.apply(null,counts.concat([1]));
  var aria='Concluídas por dia nos últimos 7 dias: '+days.map(function(d,i){return fmtDM(d)+', '+counts[i]}).join('; ');
  return '<div class="bars" role="img" aria-label="'+esc(aria)+'">'+days.map(function(d,i){
    var px=counts[i]?Math.max(6,Math.round(counts[i]/max*80)):3;
    return '<div class="barcol"><span class="bn">'+counts[i]+'</span><span class="bw"><span class="bf'+(counts[i]?'':' z')+'" style="height:'+px+'px"></span></span><span class="bl'+(d===today()?' now':'')+'">'+DOW1[parse(d).getDay()]+'</span></div>';
  }).join('')+'</div>';
}
function viewPerf(){
  var from=periodFrom(),list=inPeriod(vis(),from);
  var st=stats(list);
  var hist=[];
  vis().forEach(function(t){t.adiamentos.forEach(function(a){if(!from||localDay(a.at)>=from)hist.push({t:t,a:a})})});
  hist.sort(function(x,y){return String(y.a.at).localeCompare(String(x.a.at))});
  var opts=[['7','Últimos 7 dias'],['15','Últimos 15 dias'],['m3','Últimos 3 meses'],['m6','Últimos 6 meses'],['m9','Últimos 9 meses'],['m12','Últimos 12 meses']].map(function(o){return '<option value="'+o[0]+'"'+(UI.period===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('');
  return '<div class="perf-top"><div><h1 class="title">Seu desempenho</h1><p class="sub">Acompanhe sua execução e os adiamentos, sem controlar seu tempo.</p></div><label class="sr" for="period" style="position:absolute;left:-9999px">Período</label><select id="period" class="inp" data-s="period">'+opts+'</select></div>'+
  '<div class="stack">'+
    '<section class="card"><h2 class="ct">Visão dos indicadores</h2>'+tiles(st)+
      '<p class="note">Procrastinação considera tarefas adiadas manualmente ou que passaram do prazo sem conclusão. Tarefas em Fazendo ou Aguardando não entram. Cada tarefa conta uma vez, mesmo que tenha sido adiada mais de uma vez.</p>'+
      '<p class="note">Os indicadores consideram as tarefas com data no período escolhido, ou criadas nele quando não têm data.</p></section>'+
    '<section class="card"><h2 class="ct">Concluídas nos últimos 7 dias</h2>'+chart7()+'</section>'+
    '<section class="card"><h2 class="ct">Histórico de adiamentos</h2><p class="sub" style="margin-top:-6px">Tarefas que tiveram o prazo empurrado para depois ou removido.</p>'+
      (hist.length?'<ul class="hist">'+hist.map(function(x){

      }).join('')+'</ul>':'<p class="empty">Nenhuma data foi adiada ainda.</p>')+
    '</section></div>';
}

function syncDateUI(){
  var v=$('#f-date').value,t=today();
  document.querySelectorAll('[data-s="when"]').forEach(function(b){
    var on=(b.dataset.v==='today'&&v===t)||(b.dataset.v==='tomorrow'&&v===addDays(t,1))||(b.dataset.v==='none'&&v==='');
    b.setAttribute('aria-pressed',on?'true':'false');
  });
  var custom=v!==''&&v!==t&&v!==addDays(t,1);
  $('#b-pick').setAttribute('aria-pressed',custom?'true':'false');
  $('#pick-l').textContent=custom?dateLabel(v):'Escolher data';
  var note=$('#f-note');
  if(note)note.hidden=!(SH&&SH.edit&&SH.orig&&(v===''||v>SH.orig));
}
function sheetChoice(el){
  var k=el.dataset.s,v=el.dataset.v;
  if(k==='area'||k==='col'||k==='parea'){
    SH[k==='parea'?'area':k]=v;
    var grp=el.parentNode;
    grp.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',b===el?'true':'false')});
  }else if(k==='star'){
    SH.star=!SH.star;el.setAttribute('aria-pressed',SH.star?'true':'false');
  }else if(k==='rec'){
    SH.rec=v;
    el.parentNode.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',b===el?'true':'false')});
    var gd=$('#g-days');if(gd)gd.hidden=(v!=='custom');
  }else if(k==='day'){
    var dn=+v,ix=SH.days.indexOf(dn);
    if(ix>=0)SH.days.splice(ix,1);else SH.days.push(dn);
    el.setAttribute('aria-pressed',ix>=0?'false':'true');
    var de=$('#f-derr');if(de)de.hidden=true;
  }else if(k==='when'){
    var d=$('#f-date');
    d.value=v==='today'?today():v==='tomorrow'?addDays(today(),1):'';
    syncDateUI();
  }else if(k==='pal'){
    S.cfg.pal=v;commit();
  }else if(k==='cfg'){
    var ck=el.dataset.k;S.cfg[ck]=(ck==='weekStart')?+v:v;commit();
  }else if(k==='cfgsw'){
    var sk=el.dataset.k;S.cfg[sk]=!S.cfg[sk];commit();
  }else if(k==='theme'){
    setTheme(v);
    el.parentNode.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',b===el?'true':'false')});
  }
}
function saveTask(again){

  err.hidden=true;
  if(SH.rec==='custom'&&!SH.days.length){$('#f-derr').hidden=false;return}
  var date=$('#f-date').value||'',pj=$('#f-proj'),proj=pj?pj.value:'';
  var days=SH.rec==='custom'?SH.days.slice().sort():[];
  if(SH.edit){
    var t=taskOf(SH.edit.id);
    if(!t){closeSheet();return}
    if(SH.orig&&(date===''||date>SH.orig))t.adiamentos.push({from:SH.orig,to:date||null,at:new Date().toISOString()});
    t.title=title;t.area=SH.area;t.date=date||null;t.project=proj||null;t.rec=SH.rec||'';t.days=days;t.star=!!SH.star;
    commit();closeSheet();toast('Tarefa salva');

    S.tasks.push({id:uid('t'),title:title,area:SH.area,project:proj||null,date:date||null,col:'',done:false,doneAt:null,createdAt:new Date().toISOString(),adiamentos:[],prio:0,rec:SH.rec||'',days:days,note:'',star:!!SH.star});

function toggleTask(id,quiet){
  var t=taskOf(id);if(!t)return;

    var nx=nextOccurrence(t);

      spawn={id:uid('t'),title:t.title,area:t.area,project:t.project||null,date:nx,col:'',done:false,doneAt:null,createdAt:new Date().toISOString(),adiamentos:[],prio:0,rec:t.rec,days:(t.days||[]).slice(),note:t.note||'',star:false};

function exportData(){
  try{
    var blob=new Blob([JSON.stringify(snapshot(),null,1)],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='constancia-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    toast('Backup pronto. Procure o arquivo em Downloads.');
  }catch(e){toast('Não foi possível exportar agora.')}
}
function readImport(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.tasks))throw 0;
      UI.imp=normalize(d);render();
    }catch(e){UI.imp=null;toast('Esse arquivo não parece um backup do Constância.')}
  };
  fr.onerror=function(){toast('Não consegui ler o arquivo.')};
  fr.readAsText(file);
}
function addArea(){
  var inp=$('#f-areaname'),name=inp.value.trim(),err=$('#f-err');
  var msg='';
  if(!name)msg='Escreva o nome da área.';
  else if(S.areas.some(function(a){return a.name.toLowerCase()===name.toLowerCase()}))msg='Já existe uma área com esse nome.';
  else if(S.areas.length>=10)msg='O limite é de 10 áreas.';
  if(msg){err.textContent=msg;err.hidden=false;inp.focus();return}
  var ci=(S.areas.length%6)+1;
  S.areas.push({id:uid('a'),name:name,ci:ci});
  commit();setTimeout(function(){var f=$('#f-areaname');if(f)f.focus()},30);
}
function setTheme(v){
  var r=document.documentElement;

  else{r.removeAttribute('data-theme');lsSet(LT,'auto')}

/* ---------- troca de aba (toque ou deslize) ---------- */
function setTab(name){
  var order=TABS.map(function(t){return t[0]}),from=order.indexOf(UI.tab),to=order.indexOf(name);
  if(to<0||to===from)return;
  UI.tab=name;
  if(location.hash!=='#'+name)location.hash=name;
  render();
  var m=$('#main');
  m.removeAttribute('data-anim');void m.offsetWidth;
  m.setAttribute('data-anim',to>from?'l':'r');
}
$('#main').addEventListener('animationend',function(e){e.currentTarget.removeAttribute('data-anim')});
(function swipe(){
  var sx=0,sy=0,st=0,boardLeft=null,board=null,ok=false;
  document.addEventListener('touchstart',function(e){
    ok=false;
    if(e.touches.length!==1||$('.sheet'))return;
    var t=e.target;
    if(!t.closest('main')||t.closest('input,select,textarea'))return;
    var c=e.touches[0];sx=c.clientX;sy=c.clientY;st=Date.now();
    board=t.closest('.board');boardLeft=board?board.scrollLeft:null;
    ok=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!ok)return;ok=false;
    var c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;
    if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-st>700)return;
    if(board){
      var atStart=boardLeft<=2,atEnd=boardLeft+board.clientWidth>=board.scrollWidth-2;
      if(dx>0&&!atStart)return;
      if(dx<0&&!atEnd)return;
    }
    var order=TABS.map(function(t){return t[0]}),i=order.indexOf(UI.tab)+(dx<0?1:-1);
    if(i>=0&&i<order.length)setTab(order[i]);
  },{passive:true});
})();

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var s=e.target.closest('[data-s]');
  if(s&&s.tagName!=='SELECT'){sheetChoice(s);return}
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  switch(a){
    case 'tab':setTab(el.dataset.t);break;
    case 'fab':openTask({date:UI.tab==='calendario'?UI.calSel:''});break;
    case 'newtask':openTask({});break;
    case 'edit':openTask({id:id});break;
    case 'toggle':toggleTask(id);break;
    case 'kact':
      var kt=taskOf(id);if(!kt)break;
      var kk=el.dataset.k;
      if(kk==='start')kt.col='doing';
      else if(kk==='wait')kt.col='waiting';
      else if(kk==='back')kt.col='';
      else if(kk==='today'){var td=today();if(kt.date&&kt.date<td)kt.adiamentos.push({from:kt.date,to:td,at:new Date().toISOString()});kt.date=td;kt.col=''}
      commit();break;
    case 'area-filter':UI.area=el.dataset.v;render();break;
    case 'export':exportData();break;
    case 'logout':logout();break;
    case 'imp-ok':if(UI.imp){S=UI.imp;UI.imp=null;commit();toast('Backup restaurado')}break;
    case 'imp-no':UI.imp=null;render();break;
    case 'newproject':openProject();break;
    case 'editproject':openProject(id);break;
    case 'projtoggle':UI.open[id]=!UI.open[id];render();break;
    case 'projadd':var pr=projOf(id);openTask({project:id,area:pr?pr.area:null});break;
    case 'calmonth':UI.calOpen=!UI.calOpen;UI.calMonth=UI.calSel.slice(0,7);render();break;
    case 'calprev':case 'calnext':
      var dir=a==='calnext'?1:-1;
      if(!UI.calOpen){UI.calSel=addDays(UI.calSel,7*dir);UI.calMonth=UI.calSel.slice(0,7)}
      else{var mp=UI.calMonth.split('-').map(Number),nd=new Date(mp[0],mp[1]-1+dir,1);UI.calMonth=nd.getFullYear()+'-'+pad(nd.getMonth()+1)}
      render();break;
    case 'gotomorrow':UI.calSel=addDays(today(),1);UI.calMonth=UI.calSel.slice(0,7);setTab('calendario');break;
    case 'caltoday':UI.calSel=today();UI.calMonth=UI.calSel.slice(0,7);render();break;
    case 'pickday':UI.calSel=el.dataset.d;UI.calMonth=UI.calSel.slice(0,7);UI.calOpen=false;render();break;
    case 'dayadd':UI.calSel=el.dataset.d;openTask({date:el.dataset.d});break;
    case 'close':closeSheet();break;
    case 'save-again':saveTask(true);break;
    case 'sheet-toggle':var tid=SH&&SH.edit&&SH.edit.id;closeSheet();if(tid)toggleTask(tid);break;
    case 'sheet-del':var did=SH&&SH.edit&&SH.edit.id;armDelete(el,'Confirmar exclusão',function(){deleteTask(did)});break;
    case 'proj-del':var pid=SH&&SH.edit&&SH.edit.id;armDelete(el,'Confirmar exclusão',function(){deleteProject(pid)});break;
    case 'area-del':
      S.areas=S.areas.filter(function(x){return x.id!==id});
      commit();break;
    case 'undo':var fn=UI.undo;$('#toast').hidden=true;UI.undo=null;if(fn)fn();break;
  }
});

    var f=[].slice.call(sheet.querySelectorAll('button,input,select,[href]')).filter(function(x){return !x.disabled&&x.offsetParent!==null});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('.sheet'))render()});
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);
  if(VIEWS[h]&&h!==UI.tab)setTab(h);
});

/* ---------- início ---------- */
(function(){
  var h=location.hash.slice(1);
  if(VIEWS[h])UI.tab=h;
  render();
  initCloud();
})();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
